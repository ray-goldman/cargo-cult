[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^2.5.1
  adafruit/Adafruit GFX Library@^1.12.6
  adafruit/Adafruit SSD1306@^2.5.17

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:defmon-wroom]
platform = espressif32
board = esp32dev
build_flags =
  -D CARGO_HAS_OLED=1
  -D CARGO_HAS_NEXT_BUTTON=1
  -D CARGO_OLED_SDA=21
  -D CARGO_OLED_SCL=22
  -D CARGO_NEXT_BUTTON=26
  -D CARGO_STATUS_LED=2

[env:esp32dev-test]
platform = espressif32
board = esp32dev
test_build_src = yes
test_framework = unity
build_src_filter =
  +<role_profiles.cpp>
  +<role_identities.cpp>
  +<phase_controller.cpp>
  +<serial_commands.cpp>
